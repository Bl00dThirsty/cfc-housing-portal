# Configuration Supabase — CFC Housing Portal
#
# Instance locale (`supabase start`). Les cibles distantes et leurs secrets
# proviennent exclusivement des variables de l'environnement et des commandes
# explicites `system:staging` / `system:production`.
#
# Les migrations de `supabase/migrations/` sont la source de vérité du schéma.
# `supabase/seed.sql` porte le référentiel déclarable (natures, types de
# documents, chemises, services, produits, taux, seuils) et la matrice des
# habilitations.

project_id = "cfc-housing-portal"

[api]
enabled = true
port = 54321
# `private` n'est jamais exposé : il ne contient que des fonctions utilitaires.
schemas = ["public", "ref", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/login/reset-password",
  "http://localhost:3000/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirmez votre adresse e-mail — CFC Habitat"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.invite]
subject = "Votre invitation au Portail CFC Habitat"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Votre lien de connexion — CFC Habitat"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Réinitialisez votre mot de passe — CFC Habitat"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirmez le changement de votre adresse e-mail — CFC Habitat"
content_path = "./supabase/templates/email_change.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Modification du mot de passe de votre compte CFC Habitat"
content_path = "./templates/password_changed.html"

[auth.email.notification.email_changed]
enabled = true
subject = "Modification de l'adresse e-mail de votre compte CFC Habitat"
content_path = "./supabase/templates/email_changed.html"

[realtime]
enabled = true
