# Configuration Supabase — CFC Housing Portal
#
# Instance locale (`supabase start`) alignée sur le projet distant
# yyqfqsmsfaccsstwlpog (Crédit Foncier du Cameroun).
#
# Les migrations de `supabase/migrations/` sont la source de vérité du schéma.
# `supabase/seed.sql` porte le référentiel déclarable (natures, types de
# documents, chemises, services, produits, taux, seuils) et la matrice des
# habilitations.

project_id = "cfc-housing-portal"

[api]
enabled = true
port = 54321
# `private` n'est jamais exposé : il ne contient que des fonctions utilitaires.
schemas = ["public", "ref", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "20MiB"
# L'image de l'API Storage est épinglée à la version dont le schéma de
# migrations correspond à celui de la base locale.
#
# Pourquoi : le schéma `storage` de la base locale est au migration 79
# (`lifecycle-writer-coordination`), qui a supprimé l'index unique
# `bucketid_objname` sur `(bucket_id, name)`. Depuis, les index d'unicité
# sont partiels (`idx_objects_current_version`, `idx_objects_null_version`).
# Or storage-api v1.72.1 écrit toujours `ON CONFLICT (name, bucket_id)`,
# forme qui n'infère plus aucun index → PostgreSQL répond `42P10` et **aucun
# dépôt ne passe**. v1.89.13 teste la présence de la migration
# `objects-current-version-index` et choisit alors
# `ON CONFLICT (bucket_id, name COLLATE "C") WHERE archived_at IS NULL`,
# qui s'infère. Les deux versions doivent donc rester alignées sur le
# schéma : la base est migrée par le conteneur, c'est l'image qui décide.
image = "public.ecr.aws/supabase/storage-api:v1.89.13"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/login/reset-password",
  "http://localhost:3000/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[realtime]
enabled = true
